<div class="p-4 w-full" data-aos="fade-up">
  <div
    class="projects-card-container h-full border border-blue-400 border-opacity-60 rounded-2xl overflow-hidden bg-white"
  >
    <div class="projects-card-image">
      <a
        [href]="projectData().liveLink ?? projectData().githubLink"
        target="_blank"
      >
        <img
          class="w-full object-cover object-center"
          [src]="projectData().coverImagePath"
          [alt]="projectData().title"
        />
      </a>
    </div>

    <div class="p-6">
      <a
        [href]="projectData().liveLink ?? projectData().githubLink"
        target="_blank"
        class="title-font text-xl font-bold text-gray-900 mb-3"
      >
        {{ projectData().title }}
      </a>

      <h2
        class="text-gray-400 items-center ml-auto leading-none title-font py-1 border-gray-600"
      >
        {{ projectData().year }}
      </h2>

      <h2
        class="tracking-widest text-sm my-4 title-font font-medium text-gray-600"
      >
        {{ projectData().techStack.join(" | ") }}
      </h2>

      <p
        class="description-text leading-relaxed text-left text-lg mb-3 h-48"
        [title]="projectData().description"
      >
        {{ projectData().description }}
      </p>

      <div class="flex items-center flex-wrap p-1">
        <a
          target="_blank"
          [href]="projectData().githubLink ?? projectData().liveLink"
          class="text-indigo-500 inline-flex items-center md:mb-2 lg:mb-0"
        >
          <img
            class="h-6 md:h-9"
            src="{{ assetPaths.SIMPLE_ICONS }}/github.svg"
          />

          <span class="pl-2">Voir sur GitHub</span>
        </a>
      </div>

      <div class="flex items-center flex-wrap p-1">
        <a
          target="_blank"
          [href]="projectData().liveLink ?? projectData().githubLink"
          class="text-indigo-500 inline-flex items-center md:mb-2 lg:mb-0"
        >
          <img
            class="h-6 md:h-9"
            src="{{ assetPaths.SIMPLE_ICONS }}/world-globe-line-icon.svg"
          />

          <span class="pl-2">Voir le site</span>
        </a>
      </div>
    </div>
  </div>
</div>
