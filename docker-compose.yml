services:
  portfolio:
    build: .
    container_name: my-portfolio
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.portfolio-frontend.rule=Host(`www.zennoune.fr`) || Host(`portfolio.zennoune.fr`) || Host(`zennoune.fr`)"
      - "traefik.http.routers.portfolio-frontend.entrypoints=websecure"
      - "traefik.http.routers.portfolio-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.portfolio-frontend.loadbalancer.server.port=80"

networks:
  traefik-network:
    external: true